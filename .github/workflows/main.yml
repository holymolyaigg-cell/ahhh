name: Download Android SDK Components

on:
  workflow_dispatch: # به شما اجازه می‌دهد اجرا را دستی شروع کنید

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Platform 34
        run: |
          curl -L -o platform-34.zip "https://dl.google.com/android/repository/platform-34-ext7_r03.zip"

      - name: Download Build Tools 36
        run: |
          curl -L -o build-tools_r36_windows.zip "https://dl.google.com/android/repository/build-tools_r36_windows.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-required-files
          path: |
            platform-34.zip
            build-tools_r36_windows.zip
